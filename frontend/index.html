<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midiforja</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">♪</span>
          <div>
            <h1 id="app_title">Midiforja</h1>
            <p id="app_subtitle" class="subtitle">Convierte audio o video en MIDI</p>
          </div>
        </div>
        <label class="lang">
          <span id="lang_label">Idioma</span>
          <select id="lang_select">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </label>
      </header>

      <section id="drop" class="drop" tabindex="0" role="button" aria-label="Upload area">
        <div class="drop-inner">
          <div class="drop-icon">⤓</div>
          <p id="drop_title" class="drop-title">Suelta aquí tu audio o video</p>
          <p id="drop_hint" class="drop-hint">o haz clic para elegir</p>
          <p id="max_size" class="drop-max">Tamaño máximo: 200 MB</p>
        </div>
        <input id="file_input" type="file" hidden />
      </section>

      <div class="actions">
        <button id="transcribe_btn" class="btn primary" disabled>
          <span id="button_transcribe">Transcribir a MIDI</span>
        </button>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="bar"><div class="bar-fill" id="bar_fill"></div></div>
        <p class="status" id="status_text">Listo.</p>
      </div>

      <div class="result-actions" id="result_actions" hidden>
        <button id="open_midimate_btn" class="btn">
          <span id="button_open_midimate">Abrir en MidiMate</span>
        </button>
        <button id="again_btn" class="btn">
          <span id="button_again">Transcribir otro</span>
        </button>
      </div>

      <details class="settings">
        <summary id="settings_summary">Ajustes</summary>
        <label class="setting">
          <span id="settings_midimate_url">URL de MidiMate</span>
          <input id="midimate_url" type="text" value="http://localhost:5173" />
        </label>
        <p class="setting-hint" id="settings_hint">
          "Abrir en MidiMate" copia el .mid en la carpeta de MidiMate y abre la app.
        </p>
      </details>

      <p class="tip" id="tip"></p>
      <footer class="footer"><span id="footer"></span></footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
